<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Kershaw IB World School BHT Referral Form</title>
  

  <!-- Choices.js (pretty multi-selects) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center; }
    .wrap { background:#fff; max-width:820px; width:100%; padding:28px 32px; border-radius:12px; box-shadow:0 2px 16px rgba(0,0,0,.08); }
    label { font-weight:600; margin-top:14px; display:block; }
    input, select, textarea { width:100%; padding:10px; margin-top:6px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; }
    textarea { min-height:100px; resize:vertical; }
    button { display:inline-block; margin-top:14px; padding:10px 14px; border:0; border-radius:8px; background:#0b67d3; color:#fff; cursor:pointer; }
    button.secondary { background:#6b7280; }
    #preview { display:none; background:#f9fafb; border:1px solid #e5e7eb; padding:16px; border-radius:8px; margin-top:14px; }
    #preview li { margin:6px 0; }
    small { color:#6b7280; }

    /* Choices tweaks */
    .choices__inner{ border-radius:8px; border-color:#ccc; padding:6px 8px; }
    .choices__list--multiple .choices__item{ background:#eef2ff; border:1px solid #c7d2fe; color:#1e40af; }
    .muted { color:#6b7280; font-size:12px; margin-top:4px; display:block; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>BHT Referral Form</h2>

    <form id="BhtForm" autocomplete="off">
      <label>Role</label>
      <select name="Role" id="Role" required>
        <option value="">Select...</option>
        <option>Teacher</option><option>Case Manager</option><option>Counselor</option>
        <option>Administrator</option><option>Parent</option><option>Social Worker</option>
        <option>Psychologist</option><option>Speech Pathologist</option>
        <option>Occupational Therapist</option><option>Network Social Emotional Learning Specialist(NSEL)</option>
        <option>Diverse Learner Administrator</option><option>Youth Intervention Specialist</option>
      </select>

      <label>Student Last Name</label>
      <input name="StudentLast" required />

      <label>Student First Name</label>
      <input name="StudentFirst" required />

      <label>StudentID</label>
      <input name="StudentID" required />

      <label>Student is...</label>
      <select name="StudentStatus" required>
        <option value="">Select...</option>
        <option>GenED</option><option>IEP</option><option>504</option>
      </select>

      <label>Teacher/POC (Last, First)</label>
      <input name="TeacherName" required />

      <label>Teacher/POC Email</label>
      <input name="TeacherEmail" type="email" required />

      <label>Parent/Guardian notified?</label>
      <select name="ParentNotified" required>
        <option value="">Select...</option>
        <option>Yes</option><option>No</option>
      </select>

      <label>Main concern</label>
      <select name="MainConcern" required>
        <option value="">Select...</option>
        <option>Poor relationships w/ peers and/or adults</option>
        <option>Aggression (verbal and/or physical)</option>
        <option>Non-Compliance</option>
        <option>Sadness/Anxiety/Withdrawal/Grief</option>
        <option>Substance use/abuse</option>
        <option>Inattention/Hyperactivity</option>
        <option>Poor attendance</option>
        <option>Student reveal personal concern</option>
      </select>

      <label>Additional concern</label>
      <select name="AdditionalConcern" required>
        <option value="">Select...</option>
        <option>Poor relationships w/ peers and/or adults</option>
        <option>Aggression (verbal and/or physical)</option>
        <option>Non-Compliance</option>
        <option>Sadness/Anxiety/Withdrawal/Grief</option>
        <option>Substance use/abuse</option>
        <option>Inattention/Hyperactivity</option>
        <option>Poor attendance</option>
        <option>Student reveal personal concern</option>
      </select>

      <label>Observation</label>
      <textarea name="Observation" id="Observation" maxlength="5000" placeholder="Describe the observed behavior" required></textarea>
      <small id="ObservationCounter">0 / 5000</small>

      <!-- ✅ DROPDOWNS (multi-select) replacing checkboxes -->
      <label>Student Strength (pick all that apply)</label>
      <select id="StudentStrength" multiple></select>
      <span class="muted">You can search and pick multiple.</span>

      <label>Tier I (pick all that apply)</label>
      <select id="TierOne" multiple></select>

      <label>Tier II (pick all that apply)</label>
      <select id="TierTwo" multiple></select>

      <label>Tier III (pick all that apply)</label>
      <select id="TierThree" multiple></select>
      <span class="muted">Includes “SAS”.</span>

      <label>FBA / Tier III Plan status</label>
      <select name="FBA" required>
        <option value="">Select...</option>
        <option>Yes: New assessment conducted</option>
        <option>Yes: Revised existing plan</option>
        <option>No</option>
      </select>

      <label>Do you have behavior data?</label>
      <select name="BehaviorData" required>
        <option value="">Select...</option>
        <option>Yes</option><option>No</option>
      </select>

      <label>Time of day</label>
      <select name="BehaviorTime" required>
        <option value="">Select...</option>
        <option>Before School</option><option>Morning</option><option>Midday</option>
        <option>Afternoon</option><option>Afterschool</option>
      </select>

      <label>Subjects / Contexts</label>
      <select name="BehaviorSubject" required>
        <option value="">Select...</option>
        <option>Breakfast</option><option>Morning Meeting/Circle</option><option>Reading</option>
        <option>Math</option><option>Science</option><option>Social Studies</option>
        <option>Art</option><option>Language Prep</option><option>P.E.</option>
        <option>Lunch/Recess</option><option>Independent Work</option>
        <option>Small Group Work</option><option>Large Group Work</option>
        <option>Transitioning</option><option>Dismissal</option>
      </select>
    </form>

    <button id="previewBtn">Preview Before Submit</button>

    <div id="preview">
      <h3>Preview</h3>
      <ul id="previewList"></ul>
      <button id="confirmBtn">Confirm & Submit</button>
      <button id="resetBtn" class="secondary">Reset</button>
    </div>
  </div>

  <script>
    // Character counter
    (() => {
      const el = document.getElementById('Observation');
      const c  = document.getElementById('ObservationCounter');
      if (el && c) el.addEventListener('input', () => c.textContent = `${el.value.length} / 5000`);
    })();

    // Build Choices multi-selects with options
    const choices = {};
    function makeChoices(id, items){
      const el = document.getElementById(id);
      // seed native <option>s for accessibility / fallback
      items.forEach(v => el.add(new Option(v, v)));
      choices[id] = new Choices(el, {
        removeItemButton: true,
        searchEnabled: true,
        placeholderValue: 'Select…',
        itemSelectText: '',
        shouldSort: false,
        allowHTML: false
      });
    }

    // Options for each dropdown (edit to taste)
    makeChoices('StudentStrength', [
      'Positive parent/family support','Athletics','Art','Connection to Adults',
      'Reading','Science','Peer Relationships'
    ]);
    makeChoices('TierOne', [
      'Reinforcement system','Restorative conversations','Differentiated instruction',
      'Specific praise','Mentoring program','Behavior reflection','None'
    ]);
    makeChoices('TierTwo', [
      'Check in/Check out','Peace Circle','Tutoring','Behavior contract','None','Not sure'
    ]);
    makeChoices('TierThree', [
      'FBA/BIP (SPED)','Tier III BSP (GenED)','Individual counseling',
      'Other small group intervention','SAS','None','Not sure'
    ]);

    // Helpers
    function getMulti(id){
      return choices[id] ? choices[id].getValue(true) : [];
    }

    let payload = null;

    // Preview
    document.getElementById('previewBtn').addEventListener('click', () => {
      const form = document.getElementById('BhtForm');
      const data = Object.fromEntries(new FormData(form).entries());

      // Capture multi-selects
      data.StudentStrength = getMulti('StudentStrength');
      data.TierOne         = getMulti('TierOne');
      data.TierTwo         = getMulti('TierTwo');
      data.TierThree       = getMulti('TierThree');

      payload = data;

      // Render preview list
      const ul = document.getElementById('previewList');
      ul.innerHTML = '';
      for (const [k, v] of Object.entries(data)) {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${k}:</strong> ${Array.isArray(v) ? v.join(', ') : v}`;
        ul.appendChild(li);
      }
      document.getElementById('preview').style.display = 'block';
    });

    // Submit to Apps Script (ensure server has function `submitBht`)
    document.getElementById('confirmBtn').addEventListener('click', () => {
      if (!payload) return;
      google.script.run
        .withSuccessHandler(() => {
          alert('BHT submission saved!');
          document.getElementById('BhtForm').reset();
          Object.values(choices).forEach(c => c.removeActiveItems());
          document.getElementById('preview').style.display = 'none';
          payload = null;
        })
        .withFailureHandler(err => {
          console.error(err);
          alert('Error saving to Google Sheets.');
        })
        .submitBht(payload);
    });

    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('BhtForm').reset();
      Object.values(choices).forEach(c => c.removeActiveItems());
      document.getElementById('preview').style.display = 'none';
      payload = null;
    });
  </script>
</body>
</html>
